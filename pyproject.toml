[project]
name = "mapper-nd"
version = "0.1.0"
description = "Topological Data Analysis with the Mapper algorithm, implemented from scratch — with a filter to arbitrary dimension R^n, so the output is a full simplicial complex, not just a graph."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Miguel Roldán Rodríguez" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "typer>=0.12",
    "dash>=2.18",
    "plotly>=5.24",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
mapper-nd = "mapper_nd.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mapper_nd"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "T20"]
ignore = ["T201"]  # CLI prints are intentional via typer.echo

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
