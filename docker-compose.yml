# `docker compose up` first proves the engine recovers each dataset's known
# topology (Betti signatures), then serves the interactive dashboard.
#   - validate : runs `mapper-nd validate` once and exits 0 only if all 4/4 pass
#   - dashboard: Dash UI at http://localhost:8050 (starts after validation succeeds)

services:
  validate:
    build: .
    command: ["mapper-nd", "validate"]

  dashboard:
    build: .
    command: ["mapper-nd", "dashboard"]
    environment:
      UI_HOST: 0.0.0.0
    ports:
      - "8050:8050"
    depends_on:
      validate:
        condition: service_completed_successfully
